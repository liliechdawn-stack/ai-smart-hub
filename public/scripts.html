// ===== REAL-TIME WEBSOCKET CONNECTION (ADDED) =====
function initRealTimeWebSocket() {
    try {
        const token = localStorage.getItem('token');
        if (!token) {
            console.log('No token found, WebSocket will connect after login');
            return;
        }
        
        socket = io(BACKEND_URL, {
            transports: ['websocket', 'polling'],
            query: { token: token },
            reconnection: true,
            reconnectionAttempts: 10,
            reconnectionDelay: 1000
        });
        
        socket.on('connect', () => {
            console.log('🔌 Real-time WebSocket connected');
            const indicator = document.getElementById('liveIndicator');
            if (indicator) {
                indicator.innerHTML = '🔴 LIVE';
                indicator.style.color = '#10B981';
            }
            // Join user room
            if (userData.id) {
                socket.emit('join', userData.id);
            }
        });
        
        socket.on('workflow_execution_start', (data) => {
            console.log('🚀 Workflow started:', data);
            addRealTimeActivity('workflow', `Workflow "${data.workflow_name}" started execution`, 'success');
            updateWorkflowStatus(data.workflow_id, 'running');
        });
        
        socket.on('workflow_execution_progress', (data) => {
            console.log('📊 Workflow progress:', data);
            updateWorkflowProgress(data.workflow_id, data.node_id, data.progress);
        });
        
        socket.on('workflow_execution_complete', (data) => {
            console.log('✅ Workflow completed:', data);
            addRealTimeActivity('workflow', `Workflow "${data.workflow_name}" completed in ${data.duration}ms`, 'success');
            updateWorkflowStatus(data.workflow_id, 'completed');
            refreshWorkflowExecutions();
        });
        
        socket.on('workflow_execution_failed', (data) => {
            console.error('❌ Workflow failed:', data);
            addRealTimeActivity('workflow', `Workflow "${data.workflow_name}" failed: ${data.error}`, 'error');
            updateWorkflowStatus(data.workflow_id, 'failed');
        });
        
        socket.on('webhook_received', (data) => {
            console.log('🔔 Webhook received:', data);
            addRealTimeActivity('webhook', `Webhook "${data.path}" triggered workflow`, 'info');
        });
        
        socket.on('schedule_triggered', (data) => {
            console.log('⏰ Schedule triggered:', data);
            addRealTimeActivity('schedule', `Scheduled workflow "${data.workflow_name}" executed`, 'info');
        });
        
        socket.on('node_executed', (data) => {
            console.log('🔧 Node executed:', data);
            addRealTimeActivity('node', `Node "${data.node_name}" executed in ${data.duration}ms`, 'success');
        });
        
        socket.on('stats_update', (data) => {
            if (data.activeAgents !== undefined) activeAgents = data.activeAgents;
            if (data.imagesProcessed !== undefined) imagesProcessed = data.imagesProcessed;
            if (data.totalLeads !== undefined) totalLeads = data.totalLeads;
            if (data.hoursSaved !== undefined) hoursSaved = data.hoursSaved;
            updateStats();
        });
        
        socket.on('activity', (activity) => {
            addRealTimeActivity(activity.type, activity.message, activity.status);
        });
        
        socket.on('alert', (alert) => {
            showToast(alert.message, 'warning');
            addAlertToObservability(alert);
        });
        
        socket.on('feature_activated', (feature) => {
            console.log('✅ Feature activated:', feature);
            addActiveFeature(feature);
        });
        
        socket.on('feature_deactivated', (featureId) => {
            console.log('⏸️ Feature deactivated:', featureId);
            removeActiveFeature(featureId);
        });
        
        socket.on('disconnect', () => {
            console.log('🔌 WebSocket disconnected');
            const indicator = document.getElementById('liveIndicator');
            if (indicator) {
                indicator.innerHTML = '⭕ OFFLINE';
                indicator.style.color = '#EF4444';
            }
        });
        
        socket.on('reconnect', () => {
            console.log('🔄 WebSocket reconnected');
            const indicator = document.getElementById('liveIndicator');
            if (indicator) {
                indicator.innerHTML = '🔴 LIVE';
                indicator.style.color = '#10B981';
            }
        });
        
    } catch (error) {
        console.warn('WebSocket not available, using polling mode');
    }
}

// ===== ADD REAL-TIME ACTIVITY (ADDED) =====
function addRealTimeActivity(type, message, status) {
    const logEntry = {
        id: Date.now(),
        type: type,
        message: message,
        status: status,
        time: new Date().toLocaleTimeString(),
        icon: getActivityIcon(type),
        color: getActivityColor(status)
    };
    
    recentActivity.unshift(logEntry);
    if (recentActivity.length > 50) recentActivity.pop();
    loadActivityLog();
}

function getActivityIcon(type) {
    const icons = {
        'workflow': 'fa-project-diagram',
        'webhook': 'fa-globe',
        'schedule': 'fa-clock',
        'node': 'fa-code-branch',
        'ai': 'fa-brain',
        'social': 'fa-share-alt',
        'email': 'fa-envelope',
        'slack': 'fa-slack',
        'http': 'fa-code',
        'automation': 'fa-robot',
        'default': 'fa-info-circle'
    };
    return icons[type] || icons.default;
}

function getActivityColor(status) {
    const colors = {
        'success': '#10B981',
        'error': '#EF4444',
        'warning': '#F59E0B',
        'info': '#3B82F6'
    };
    return colors[status] || colors.info;
}

// ===== REFRESH WORKFLOW EXECUTIONS (ADDED) =====
async function refreshWorkflowExecutions() {
    try {
        const token = localStorage.getItem('token');
        const response = await fetch(`${API_BASE}/executions`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (response.ok) {
            workflowExecutions = await response.json();
            updateExecutionsDisplay();
        }
    } catch (error) {
        console.error('Error refreshing executions:', error);
    }
}

function updateExecutionsDisplay() {
    const container = document.getElementById('recentExecutions');
    if (!container) return;
    
    if (workflowExecutions.length === 0) {
        container.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">No executions yet</div>';
        return;
    }
    
    container.innerHTML = workflowExecutions.slice(0, 5).map(exec => `
        <div class="execution-item" style="display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #2a2a2a;">
            <div class="execution-status" style="width: 32px; text-align: center;">
                <i class="fas ${exec.status === 'completed' ? 'fa-check-circle' : exec.status === 'failed' ? 'fa-times-circle' : 'fa-spinner fa-pulse'}" 
                   style="color: ${exec.status === 'completed' ? '#10B981' : exec.status === 'failed' ? '#EF4444' : '#F59E0B'};"></i>
            </div>
            <div class="execution-details" style="flex: 1;">
                <div class="execution-name" style="font-weight: 500; font-size: 13px;">${exec.workflow_name || 'Workflow'}</div>
                <div class="execution-time" style="font-size: 11px; color: #666;">${new Date(exec.started_at).toLocaleString()}</div>
            </div>
            <div class="execution-duration" style="font-size: 12px; color: #888;">${exec.execution_time_ms ? (exec.execution_time_ms / 1000).toFixed(2) + 's' : 'pending'}</div>
        </div>
    `).join('');
}

function updateWorkflowStatus(workflowId, status) {
    const workflowCard = document.getElementById(`workflow-${workflowId}`);
    if (workflowCard) {
        const statusBadge = workflowCard.querySelector('.workflow-status');
        if (statusBadge) {
            statusBadge.className = `workflow-status ${status}`;
            statusBadge.innerHTML = status === 'running' ? '<i class="fas fa-spinner fa-pulse"></i> Running' : 
                                   status === 'completed' ? '<i class="fas fa-check-circle"></i> Completed' :
                                   '<i class="fas fa-exclamation-circle"></i> Failed';
        }
    }
}

function updateWorkflowProgress(workflowId, nodeId, progress) {
    const progressBar = document.getElementById(`progress-${workflowId}`);
    if (progressBar) {
        progressBar.style.width = `${progress}%`;
    }
}

// ===== START REAL-TIME MONITORING (ADDED) =====

        }
    }, 10000);
}

async function deployWorkflow() {
    if (workflowNodes.length === 0) {
        showToast('No nodes in workflow', 'error');
        return;
    }
    
    const name = document.getElementById('workflowNameDisplay')?.textContent || 'My Workflow';
    
    showToast('🚀 Deploying workflow...', 'info');
    
    try {
        const token = localStorage.getItem('token');
        const response = await fetch(`${API_BASE}/workflows`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                name: name,
                nodes: workflowNodes,
                edges: workflowEdges,
                execution_mode: 'sequential',
                status: 'active'
            })
        });
        
        if (response.ok) {
            const workflow = await response.json();
            showToast(`✅ Workflow "${name}" deployed successfully!`, 'success');
            addRealTimeActivity('workflow', `Deployed workflow "${name}"`, 'success');
            closeWorkflowBuilder();
            await loadUserAutomations();
            
            // Register webhook if trigger node exists
            const hasTrigger = workflowNodes.some(n => n.type === 'trigger');
            if (hasTrigger) {
                const webhookPath = `workflow_${workflow.id}`;
                await fetch(`${API_BASE}/webhooks/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        path: webhookPath,
                        workflow_id: workflow.id,
                        method: 'POST'
                    })
                });
                showToast(`🔔 Webhook created: /webhook/${webhookPath}`, 'success');
                addRealTimeActivity('webhook', `Webhook registered for workflow "${name}"`, 'success');
            }
        } else {
            throw new Error('Failed to deploy');
        }
    } catch (error) {
        console.error('Deploy error:', error);
        showToast('Failed to deploy workflow', 'error');
    }
}

function handleNodeDragStart(event, nodeType) {
    event.dataTransfer.setData('text/plain', nodeType);
    event.dataTransfer.effectAllowed = 'copy';
}

function addNodeToCanvas(nodeType, x, y) {
    const nodeData = WORKFLOW_NODE_TYPES[nodeType];
    if (!nodeData) return;
    
    const newNode = {
        id: `node_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`,
        type: nodeType,
        name: nodeData.name,
        icon: nodeData.icon,
        color: nodeData.color,
        x: x,
        y: y,
        config: {},
        outputs: ['next']
    };
    
    // Initialize config with defaults
    if (nodeData.configFields) {
        nodeData.configFields.forEach(field => {
            newNode.config[field.name] = field.default;
        });
    }
    
    workflowNodes.push(newNode);
    renderWorkflowCanvas();
    showToast(`Added ${nodeData.name} node`, 'success');
}

function renderWorkflowCanvas() {
    const canvas = document.getElementById('workflowCanvas');
    if (!canvas) return;
    
    // Clear canvas
    canvas.innerHTML = '';
    
    // Draw connections first (so they appear behind nodes)
    workflowEdges.forEach(edge => {
        const startNode = workflowNodes.find(n => n.id === edge.source);
        const endNode = workflowNodes.find(n => n.id === edge.target);
        if (startNode && endNode) {
            const startX = startNode.x + 200;
            const startY = startNode.y + 45;
            const endX = endNode.x;
            const endY = endNode.y + 45;
            
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.style.position = 'absolute';
            svg.style.top = '0';
            svg.style.left = '0';
            svg.style.width = '100%';
            svg.style.height = '100%';
            svg.style.pointerEvents = 'none';
            svg.style.zIndex = '5';
            
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const d = `M ${startX} ${startY} C ${startX + 80} ${startY}, ${endX - 80} ${endY}, ${endX} ${endY}`;
            path.setAttribute('d', d);
            path.setAttribute('stroke', '#d4af37');
            path.setAttribute('stroke-width', '2');
            path.setAttribute('fill', 'none');
            svg.appendChild(path);
            canvas.appendChild(svg);
        }
    });
    
    // Draw nodes
    workflowNodes.forEach(node => {
        const nodeData = WORKFLOW_NODE_TYPES[node.type];
        const nodeEl = document.createElement('div');
        nodeEl.className = 'workflow-node';
        if (selectedWorkflowNode === node.id) nodeEl.classList.add('selected');
        nodeEl.style.left = node.x + 'px';
        nodeEl.style.top = node.y + 'px';
        nodeEl.style.position = 'absolute';
        nodeEl.style.width = '200px';
        
        nodeEl.innerHTML = `
            <div class="workflow-node-header">
                <div class="workflow-node-header-icon" style="background: ${node.color};">
                    <i class="fas ${node.icon}"></i>
                </div>
                <div class="workflow-node-header-title">${node.name}</div>
                <div class="workflow-node-header-actions">
                    <button onclick="deleteWorkflowNode('${node.id}')" title="Delete"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="workflow-node-content">
                ${Object.entries(node.config).slice(0, 2).map(([key, value]) => `
                    <div><strong>${key}:</strong> ${typeof value === 'object' ? JSON.stringify(value).substring(0, 30) : String(value).substring(0, 30)}</div>
                `).join('') || '<i>Click to configure</i>'}
            </div>
            <div class="workflow-node-port input" data-node-id="${node.id}" data-port-type="input" onclick="startConnection('${node.id}', 'input', event)"></div>
            <div class="workflow-node-port output" data-node-id="${node.id}" data-port-type="output" onclick="startConnection('${node.id}', 'output', event)"></div>
        `;
        
        // Make node draggable
        nodeEl.addEventListener('mousedown', (e) => {
            if (e.target.closest('.workflow-node-port')) return;
            if (e.target.closest('.workflow-node-header-actions')) return;
            
            selectedWorkflowNode = node.id;
            renderWorkflowCanvas();
            renderNodeProperties(node);
            
            let startX = e.clientX;
            let startY = e.clientY;
            let originalX = node.x;
            let originalY = node.y;
            
            const onMouseMove = (moveEvent) => {
                const dx = moveEvent.clientX - startX;
                const dy = moveEvent.clientY - startY;
                node.x = originalX + dx;
                node.y = originalY + dy;
                renderWorkflowCanvas();
            };
            
            const onMouseUp = () => {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            };
            
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });
        
        canvas.appendChild(nodeEl);
    });
    
    // Add drop handler
    canvas.addEventListener('dragover', (e) => {
        e.preventDefault();
    });
    
    canvas.addEventListener('drop', (e) => {
        e.preventDefault();
        const nodeType = e.dataTransfer.getData('text/plain');
        if (nodeType && WORKFLOW_NODE_TYPES[nodeType]) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left - 100;
            const y = e.clientY - rect.top - 40;
            addNodeToCanvas(nodeType, x, y);
        }
    });
}

function renderNodeProperties(node) {
    const panel = document.getElementById('nodePropertiesPanel');
    if (!panel) return;
    
    const nodeData = WORKFLOW_NODE_TYPES[node.type];
    if (!nodeData || !nodeData.configFields) {
        panel.innerHTML = '<div style="text-align: center; color: #666; padding: 40px;">No configuration available</div>';
        return;
    }
    
    let html = `
        <div style="margin-bottom: 16px;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
                <div class="node-type-icon" style="background: ${node.color}; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 6px;">
                    <i class="fas ${node.icon}"></i>
                </div>
                <div>
                    <div style="font-weight: 600;">${node.name}</div>
                    <div style="font-size: 11px; color: #666;">${nodeData.description}</div>
                </div>
            </div>
        </div>
    `;
    
    nodeData.configFields.forEach(field => {
        const value = node.config[field.name] || field.default || '';
        
        if (field.type === 'textarea') {
            html += `
                <div class="node-field" style="margin-bottom: 12px;">
                    <label style="display: block; font-size: 11px; color: #aaa; margin-bottom: 4px;">${field.label}</label>
                    <textarea class="form-control" data-field="${field.name}" style="width: 100%; padding: 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px; color: white; font-size: 12px; resize: vertical; min-height: 60px;">${value}</textarea>
                </div>
            `;
        } else if (field.type === 'select') {
            html += `
                <div class="node-field" style="margin-bottom: 12px;">
                    <label style="display: block; font-size: 11px; color: #aaa; margin-bottom: 4px;">${field.label}</label>
                    <select class="form-control" data-field="${field.name}" style="width: 100%; padding: 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px; color: white;">
                        ${field.options.map(opt => `<option value="${opt}" ${value === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                    </select>
                </div>
            `;
        } else if (field.type === 'boolean') {
            html += `
                <div class="node-field" style="margin-bottom: 12px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" data-field="${field.name}" ${value ? 'checked' : ''}>
                        <span style="font-size: 11px; color: #aaa;">${field.label}</span>
                    </label>
                </div>
            `;
        } else {
            html += `
                <div class="node-field" style="margin-bottom: 12px;">
                    <label style="display: block; font-size: 11px; color: #aaa; margin-bottom: 4px;">${field.label}</label>
                    <input type="${field.type || 'text'}" data-field="${field.name}" value="${value}" 
                           style="width: 100%; padding: 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 6px; color: white; font-size: 12px;">
                </div>
            `;
        }
    });
    
    panel.innerHTML = html;
    
    // Add change handlers
    panel.querySelectorAll('input, select, textarea').forEach(input => {
        input.addEventListener('change', (e) => {
            const fieldName = input.dataset.field;
            let newValue = input.type === 'checkbox' ? input.checked : input.value;
            if (fieldName) {
                node.config[fieldName] = newValue;
                renderWorkflowCanvas();
            }
        });
    });
}

function startConnection(nodeId, portType, event) {
    event.stopPropagation();
    isConnecting = true;
    connectionStartNode = { id: nodeId, type: portType };
    
    // Create temporary connection line
    const canvas = document.getElementById('workflowCanvas');
    const tempLine = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    tempLine.style.position = 'absolute';
    tempLine.style.top = '0';
    tempLine.style.left = '0';
    tempLine.style.width = '100%';
    tempLine.style.height = '100%';
    tempLine.style.pointerEvents = 'none';
    tempLine.style.zIndex = '100';
    
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.classList.add('workflow-connection-temp');
    tempLine.appendChild(path);
    canvas.appendChild(tempLine);
    
    const onMouseMove = (moveEvent) => {
        if (!isConnecting) return;
        const startNode = workflowNodes.find(n => n.id === nodeId);
        if (startNode) {
            const startX = startNode.x + (portType === 'output' ? 200 : 0);
            const startY = startNode.y + 45;
            const endX = moveEvent.clientX - canvas.getBoundingClientRect().left;
            const endY = moveEvent.clientY - canvas.getBoundingClientRect().top;
            const d = `M ${startX} ${startY} C ${startX + 80} ${startY}, ${endX - 80} ${endY}, ${endX} ${endY}`;
            path.setAttribute('d', d);
        }
    };
    
    const onMouseUp = (upEvent) => {
        if (!isConnecting) return;
        
        // Find target node under cursor
        const targetElement = document.elementsFromPoint(upEvent.clientX, upEvent.clientY);
        let targetPort = null;
        for (const el of targetElement) {
            if (el.classList && el.classList.contains('workflow-node-port')) {
                targetPort = el;
                break;
            }
        }
        
        if (targetPort) {
            const targetNodeId = targetPort.dataset.nodeId;
            const targetPortType = targetPort.dataset.portType;
            
            if (targetNodeId && targetNodeId !== nodeId) {
                if (portType === 'output' && targetPortType === 'input') {
                    // Check if connection already exists
                    const exists = workflowEdges.some(e => e.source === nodeId && e.target === targetNodeId);
                    if (!exists) {
                        workflowEdges.push({ source: nodeId, target: targetNodeId });
                        renderWorkflowCanvas();
                        showToast('Connection created', 'success');
                    }
                }
            }
        }
        
        // Clean up
        isConnecting = false;
        connectionStartNode = null;
        if (tempLine) tempLine.remove();
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
    };
    
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup', onMouseUp);
}

function deleteWorkflowNode(nodeId) {
    workflowNodes = workflowNodes.filter(n => n.id !== nodeId);
    workflowEdges = workflowEdges.filter(e => e.source !== nodeId && e.target !== nodeId);
    if (selectedWorkflowNode === nodeId) selectedWorkflowNode = null;
    renderWorkflowCanvas();
    showToast('Node deleted', 'info');
}

async function saveWorkflow() {
    const name = prompt('Enter workflow name:', 'My Automation Workflow');
    if (!name) return;
    
    const workflowData = {
        name: name,
        nodes: workflowNodes,
        edges: workflowEdges,
        execution_mode: 'sequential'
    };
    
    try {
        const token = localStorage.getItem('token');
        let url = `${API_BASE}/workflows`;
        let method = 'POST';
        
        if (currentWorkflowId) {
            url = `${API_BASE}/workflows/${currentWorkflowId}`;
            method = 'PUT';
        }
        
        const response = await fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(workflowData)
        });
        
        if (response.ok) {
            const data = await response.json();
            showToast(`Workflow "${name}" saved successfully!`, 'success');
            closeWorkflowBuilder();
        } else {
            throw new Error('Failed to save');
        }
    } catch (error) {
        console.error('Error saving workflow:', error);
        showToast('Failed to save workflow', 'error');
    }
}

// ===== TOKEN HELPERS =====
function getPlanFromToken() {
    try {
        const token = localStorage.getItem('token');
        if (!token) return null;
        const parts = token.split('.');
        if (parts.length !== 3) return null;
        return JSON.parse(atob(parts[1]));
    } catch (e) {
        return null;
    }
}

// ===== CHECK ACCESS =====
async function checkAccess() {
    try {
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
            return false;
        }

        const payload = getPlanFromToken();
        if (payload) {
            userPlan = (payload.plan || 'free').toLowerCase();
            if (payload.email === ADMIN_EMAIL) return true;
            if (userPlan === 'pro' || userPlan === 'agency') return true;
        }

        const response = await fetch(`${BACKEND_URL}/api/dashboard/full`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('Failed to fetch plan');

        const data = await response.json();
        userPlan = (data.plan || 'free').toLowerCase();
        
        if (userPlan === 'pro' || userPlan === 'agency' || data.email === ADMIN_EMAIL) {
            return true;
        }
        return false;
    } catch (err) {
        console.error("[ACCESS CHECK ERROR]", err);
        return false;
    }
}

// ===== WEBSOCKET CONNECTION =====
function initWebSocket() {
    try {
        const token = localStorage.getItem('token');
        socket = io(BACKEND_URL, {
            transports: ['websocket'],
            query: { token }
        });
        
        socket.on('connect', () => {
            console.log('🔌 WebSocket connected - Real-time updates active');
            const indicator = document.getElementById('liveIndicator');
            if (indicator) indicator.innerHTML = '🔴 Live';
        });
        
        socket.on('stats_update', (data) => {
            console.log('📊 Stats update received', data);
            if (data.activeAgents !== undefined) {
                activeAgents = data.activeAgents;
                updateStats();
            }
        });
        
        socket.on('activity', (activity) => {
            console.log('📋 New activity:', activity);
            recentActivity.unshift(activity);
            if (recentActivity.length > 10) recentActivity.pop();
            loadActivityLog();
        });
        
        socket.on('alert', (alert) => {
            console.log('⚠️ New alert:', alert);
            showToast(alert.message, 'warning');
            addAlertToObservability(alert);
        });
        
        socket.on('feature_activated', (feature) => {
            console.log('✅ Feature activated:', feature);
            addActiveFeature(feature);
        });
        
        socket.on('feature_deactivated', (featureId) => {
            console.log('⏸️ Feature deactivated:', featureId);
            removeActiveFeature(featureId);
        });
        
        socket.on('disconnect', () => {
            console.log('🔌 WebSocket disconnected');
            const indicator = document.getElementById('liveIndicator');
            if (indicator) indicator.innerHTML = '⭕ Offline';
        });
    } catch (error) {
        console.warn('WebSocket not available, using polling');
    }
}

// ===== START AUTOMATION SCHEDULER =====
function startAutomationScheduler() {
    console.log('⏰ Starting automation scheduler...');
    
    automationScheduler = setInterval(async () => {
        const now = new Date();
        const currentHour = now.getHours();
        const currentMinute = now.getMinutes();
        const currentTime = `${currentHour.toString().padStart(2, '0')}:${currentMinute.toString().padStart(2, '0')}`;
        
        for (const account of connectedAccounts) {
            for (const [featureId, platforms] of Object.entries(FEATURE_PLATFORM_MAP)) {
                if (!platforms.includes(account.platform)) continue;
                
                const schedule = AUTOMATION_SCHEDULES[featureId];
                if (!schedule) continue;
                
                const featureCard = document.getElementById(featureId);
                if (!featureCard || !featureCard.classList.contains('live')) continue;
                
                let shouldRun = false;
                
                if (schedule.frequency === 'realtime') {
                    shouldRun = true;
                } else if (schedule.frequency === 'hourly') {
                    shouldRun = currentMinute === 0;
                } else if (schedule.frequency === 'daily' && schedule.time === currentTime) {
                    shouldRun = true;
                }
                
                if (shouldRun) {
                    executeScheduledAutomation(account, featureId);
                }
            }
        }
    }, 60000);
}

// ===== GET AI RECOMMENDATIONS =====
async function getAIRecommendations() {
    if (connectedAccounts.length === 0) return;
    
    const recommendations = [];
    
    for (const account of connectedAccounts) {
        const accountAge = daysSince(account.created_at);
        
        if (accountAge < 7) {
            recommendations.push({
                platform: account.platform,
                feature: 'AI Content Studio',
                reason: 'New account detected - start with daily posts to build audience',
                priority: 'high',
                action: 'content'
            });
        }
        
        const activeFeatureIds = activeFeatures.map(f => f.id);
        
        for (const [featureId, platforms] of Object.entries(FEATURE_PLATFORM_MAP)) {
            if (!platforms.includes(account.platform)) continue;
            
            const featureCard = document.getElementById(featureId);
            const featureName = featureCard?.querySelector('h3')?.textContent || featureId;
            
            if (!activeFeatureIds.includes(featureId)) {
                recommendations.push({
                    platform: account.platform,
                    feature: featureName,
                    reason: `This feature works great with ${account.platform} and could boost your results`,
                    priority: 'medium',
                    action: 'activate'
                });
            }
        }
    }
    
    return recommendations.slice(0, 3);
}

// ===== DAYS SINCE HELPER =====
function daysSince(dateString) {
    if (!dateString) return 0;
    const then = new Date(dateString);
    const now = new Date();
    const diffTime = Math.abs(now - then);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    return diffDays;
}

async function loadUserAutomations() {
    try {
        const token = localStorage.getItem('token');
        const response = await fetch(`${API_BASE}/automations`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (response.status === 401) { 
            localStorage.removeItem('token'); 
            window.location.href = 'login.html'; 
            return; 
        } 
        if (response.ok) {
            userAutomations = await response.json();
            const live = userAutomations.filter(a => a.status === 'active').length;
            const paused = userAutomations.filter(a => a.status === 'paused').length;
            const today = userAutomations.filter(a => {
                const lastRun = new Date(a.last_run || 0);
                const today = new Date();
                return lastRun.toDateString() === today.toDateString();
            }).length;
            
            const liveCountEl = document.getElementById('liveCount');
            const pausedCountEl = document.getElementById('pausedCount');
            const totalRunsEl = document.getElementById('totalRuns');
            if (liveCountEl) liveCountEl.textContent = live;
            if (pausedCountEl) pausedCountEl.textContent = paused;
            if (totalRunsEl) totalRunsEl.textContent = today;
            
            const connectedTypes = connectedAccounts.map(a => {
                const platform = platforms.find(p => p.id === a.platform);
                return platform ? platform.type : 'api-wrapper';
            });
            
            const fullSaaS = connectedTypes.filter(t => t === 'saas').length;
            const gateways = connectedTypes.filter(t => t === 'gateway').length;
            const wrappers = connectedTypes.filter(t => t === 'api-wrapper').length;
            
            const total = connectedTypes.length || 1;
            const score = Math.round(((fullSaaS * 100) + (gateways * 80) + (wrappers * 30)) / total);
            const governanceScoreEl = document.getElementById('governanceScore');
            if (governanceScoreEl) governanceScoreEl.textContent = score + '%';
        }
    } catch (error) {
        console.error('Error loading automations:', error);
    }
}

                grid.innerHTML = '<div style="padding: 40px; text-align: center; width: 100%; color: var(--text-muted);"><i class="fas fa-plug fa-3x" style="margin-bottom: 15px; opacity: 0.5;"></i><h3>No accounts connected</h3><p>Connect your first platform to start automating</p><button class="btn-primary" onclick="showConnectModal()" style="margin-top: 15px;"><i class="fas fa-plus"></i> Connect Account</button></div>';
                return;
            }
            
            grid.innerHTML = accounts.map(account => {
                const platform = platforms.find(p => p.id === account.platform) || { 
                    icon: 'fas fa-plug', 
                    color: '#64748b',
                    name: account.platform || 'Unknown',
                    type: 'api-wrapper',
                    governance: 'basic'
                };
                
                let typeBadge = '';
                if (platform.type === 'saas') {
                    typeBadge = '<span class="platform-type-badge type-saas"><i class="fas fa-building"></i> Full SaaS</span>';
                } else if (platform.type === 'gateway') {
                    typeBadge = '<span class="platform-type-badge type-gateway"><i class="fas fa-cloud"></i> Gateway</span>';
                } else {
                    typeBadge = '<span class="platform-type-badge type-api-wrapper"><i class="fas fa-key"></i> API Wrapper</span>';
                }
                
                let accountInfo = account.account_info || {};
                if (typeof accountInfo === 'string') {
                    try {
                        accountInfo = JSON.parse(accountInfo);
                    } catch (e) {
                        accountInfo = {};
                    }
                }
                
                const accountName = account.account_name || account.name || platform.name;
                const lastSync = account.last_sync ? new Date(account.last_sync).toLocaleString() : 'Never';
                
                const govFeatures = platform.governance === 'full' ? 
                    '<div class="governance-tags"><span class="gov-tag"><i class="fas fa-check-circle"></i> Model Policies</span><span class="gov-tag"><i class="fas fa-check-circle"></i> Budget Controls</span><span class="gov-tag"><i class="fas fa-check-circle"></i> Audit Logs</span></div>' :
                    platform.governance === 'high' ?
                    '<div class="governance-tags"><span class="gov-tag"><i class="fas fa-check-circle"></i> Unified Billing</span><span class="gov-tag"><i class="fas fa-check-circle"></i> Rate Limiting</span></div>' :
                    '<div class="governance-tags"><span class="gov-tag"><i class="fas fa-exclamation-triangle"></i> Basic Governance</span></div>';
                
                return `
                    <div class="account-card">
                        <div class="account-row">
                            <div class="account-info">
                                <div class="account-avatar" style="background: ${platform.color};">
                                    <i class="${platform.icon}"></i>
                                </div>
                                <div class="account-details">
                                    <h4>${accountName} ${typeBadge}</h4>
                                    <p>${platform.name}</p>
                                    ${govFeatures}
                                </div>
                            </div>
                            <div class="account-status">
                                <span class="status-badge" style="background: ${account.status === 'active' ? 'var(--success)' : 'var(--warning)'};"></span>
                                <button class="icon-btn" onclick="configureAccount('${account.platform}')">
                                    <i class="fas fa-cog"></i>
                                </button>
                                <button class="icon-btn" onclick="createWorkflowFromAccount('${account.platform}')" title="Create Workflow">
                                    <i class="fas fa-project-diagram"></i>
                                </button>
                            </div>
                        </div>
                        <small style="color: var(--text-muted); font-size: 0.7rem; margin-top: 8px; display: block;">
                            Last sync: ${lastSync} | 
                            ${platform.multiAgent ? '<i class="fas fa-check-circle" style="color: var(--success);"></i> Multi-agent support' : '<i class="fas fa-times-circle" style="color: var(--text-muted);"></i> Single agent'}
                        </small>
                    </div>
                `;
            }).join('');
        } else {
            const errorText = await response.text();
            console.error('Error response:', errorText);
            throw new Error(`HTTP ${response.status}: ${errorText}`);
        }
    } catch (error) {
        console.error('Error loading accounts:', error);
        grid.innerHTML = '<div style="padding: 40px; text-align: center; width: 100%; color: var(--text-muted);"><i class="fas fa-exclamation-triangle fa-3x" style="margin-bottom: 15px; opacity: 0.5;"></i><h3>Failed to load accounts</h3><p>Please try again later</p><button class="btn-primary" onclick="loadConnectedAccounts()" style="margin-top: 10px;">Retry</button></div>';
    }
}

// ===== LOAD PLATFORM OPTIONS =====
function loadPlatformOptions() {
    const optionsDiv = document.getElementById('platformOptions');
    if (!optionsDiv) return;
    
    const sortedPlatforms = [...platforms].sort((a, b) => {
        const order = { 'saas': 1, 'gateway': 2, 'api-wrapper': 3 };
        return (order[a.type] || 4) - (order[b.type] || 4);
    });
    
    optionsDiv.innerHTML = sortedPlatforms.map(p => {
        let typeIndicator = '';
        if (p.type === 'saas') typeIndicator = '<span class="platform-type-indicator type-saas"><i class="fas fa-building"></i></span>';
        else if (p.type === 'gateway') typeIndicator = '<span class="platform-type-indicator type-gateway"><i class="fas fa-cloud"></i></span>';
        else typeIndicator = '<span class="platform-type-indicator type-api-wrapper"><i class="fas fa-key"></i></span>';
        
        return `
            <div class="platform-option" onclick="selectPlatform('${p.id}')" data-platform="${p.id}">
                ${typeIndicator}
                <i class="${p.icon}" style="color: ${p.color};"></i>
                <p>${p.name}</p>
                <small style="font-size: 0.6rem; color: var(--text-muted);">${p.type === 'saas' ? 'Full SaaS' : p.type === 'gateway' ? 'Gateway' : 'API'}</small>
            </div>
        `;
    }).join('');
}

// ===== TOGGLE CONNECTION METHOD =====
function toggleConnectionMethod() {
    const method = document.getElementById('connectionMethod')?.value;
    const gatewayFields = document.getElementById('gatewayFields');
    const directFields = document.getElementById('directFields');
    if (method === 'gateway') {
        if (gatewayFields) gatewayFields.style.display = 'block';
        if (directFields) directFields.style.display = 'none';
    } else {
        if (gatewayFields) gatewayFields.style.display = 'none';
        if (directFields) directFields.style.display = 'block';
    }
}

// ===== SEARCH PLATFORMS =====
function searchPlatforms() {
    const searchTerm = document.getElementById('platformSearch')?.value.toLowerCase().trim() || '';
    const accountCards = document.querySelectorAll('.account-card');
    const featureCards = document.querySelectorAll('.feature-card');
    
    if (searchTerm === '') {
        accountCards.forEach(card => card.style.display = 'flex');
        featureCards.forEach(card => card.style.display = 'block');
        return;
    }
    
    accountCards.forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(searchTerm) ? 'flex' : 'none';
    });
    
    featureCards.forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(searchTerm) ? 'block' : 'none';
    });
    
    showToast(`🔍 Searching for "${searchTerm}"`, 'info');
}

// ===== FILTER FEATURES =====
function filterFeatures(category) {
    const tabs = document.querySelectorAll('.feature-tab');
    tabs.forEach(tab => tab.classList.remove('active'));
    if (event && event.target) event.target.classList.add('active');
    
    const cards = document.querySelectorAll('.feature-card');
    cards.forEach(card => {
        card.style.display = (category === 'all' || card.dataset.category === category) ? 'block' : 'none';
    });
}

// ===== LOAD ACTIVITY LOG =====
async function loadActivityLog() {
    const log = document.getElementById('activityLog');
    if (!log) return;
    
    try {
        const token = localStorage.getItem('token');
        const response = await fetch(`${API_BASE}/powerhouse/activity`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (!response.ok) throw new Error('Failed to load activity');
        
        const activities = await response.json();
        recentActivity = activities || [];
        
        if (recentActivity.length === 0) {
            log.innerHTML = `
                <div class="log-header">
                    <span class="chart-title">Recent Activity</span>
                    <span style="color: var(--text-muted); font-size: 0.75rem;" id="liveIndicator">Live</span>
                </div>
                <div style="padding: 30px; text-align: center; color: var(--text-muted);">
                    <i class="fas fa-history fa-2x" style="margin-bottom: 10px; opacity: 0.5;"></i>
                    <p>No recent activity</p>
                </div>
            `;
            return;
        }
        
        log.innerHTML = `
            <div class="log-header">
                <span class="chart-title">Recent Activity</span>
                <span style="color: var(--text-muted); font-size: 0.75rem;" id="liveIndicator">Live</span>
            </div>
            ${recentActivity.map(a => {
                let icon = 'fa-info-circle';
                if (a.type === 'budget') icon = 'fa-dollar-sign';
                else if (a.type === 'alert') icon = 'fa-exclamation-triangle';
                else if (a.type === 'approval') icon = 'fa-check-circle';
                else if (a.type === 'content') icon = 'fa-pen-fancy';
                else if (a.type === 'social') icon = 'fa-share-alt';
                else if (a.type === 'video') icon = 'fa-video';
                else if (a.type === 'automation') icon = 'fa-robot';
                
                return `
                <div class="log-entry">
                    <div class="log-icon"><i class="fas ${icon}"></i></div>
                    <div class="log-content">
                        <div class="log-title">${a.title || a.message || 'Activity'}</div>
                        <div class="log-time">${a.time || a.created_at || 'Just now'}</div>
                    </div>
                </div>
            `}).join('')}
        `;
    } catch (error) {
        console.error('Error loading activity:', error);
        log.innerHTML = `
            <div class="log-header">
                <span class="chart-title">Recent Activity</span>
                <span style="color: var(--text-muted); font-size: 0.75rem;" id="liveIndicator">Live</span>
            </div>
            <div style="padding: 30px; text-align: center; color: var(--text-muted);">
                <i class="fas fa-exclamation-circle fa-2x" style="margin-bottom: 10px; opacity: 0.5;"></i>
                <p>Unable to load activity</p>
                <button class="btn-primary" onclick="loadActivityLog()" style="margin-top: 10px; padding: 8px 16px; font-size: 0.8rem;">Retry</button>
            </div>
        `;
    }
}

function showConnectModal() {
    const modal = document.getElementById('connectModal');
    if (modal) modal.classList.add('active');

}

function closeModal() {
    const modal = document.getElementById('connectModal');
    if (modal) modal.classList.remove('active');
    selectedPlatform = null;
    const platformOptions = document.querySelectorAll('.platform-option');
    platformOptions.forEach(opt => opt.classList.remove('selected'));
    const accountName = document.getElementById('accountName');
    const cfAccountId = document.getElementById('cfAccountId');
    const gatewayName = document.getElementById('gatewayName');
    const cfToken = document.getElementById('cfToken');
    const apiKey = document.getElementById('apiKey');
    const additionalFields = document.getElementById('additionalFields');
    if (accountName) accountName.value = '';
    if (cfAccountId) cfAccountId.value = '';
    if (gatewayName) gatewayName.value = '';
    if (cfToken) cfToken.value = '';
    if (apiKey) apiKey.value = '';
    if (additionalFields) {
        additionalFields.innerHTML = '';
        additionalFields.style.display = 'none';
    }
}

function selectPlatform(platformId) {
    const platformOptions = document.querySelectorAll('.platform-option');
    platformOptions.forEach(opt => opt.classList.remove('selected'));
    if (event && event.target) {
        const target = event.target.closest('.platform-option');
        if (target) target.classList.add('selected');
    }
    selectedPlatform = platformId;
    
    const platform = platforms.find(p => p.id === platformId);
    
    if (platform && (platform.type === 'saas' || platform.type === 'gateway')) {
        const connectionMethod = document.getElementById('connectionMethod');
        if (connectionMethod) connectionMethod.value = 'gateway';
        toggleConnectionMethod();
        showToast(`💡 ${platform.name} works best with Cloudflare Gateway for governance`, 'info');
    } else {
        const connectionMethod = document.getElementById('connectionMethod');
        if (connectionMethod) connectionMethod.value = 'direct';
        toggleConnectionMethod();
    }
}

// ===== FETCH REAL OBSERVABILITY DATA =====
async function fetchRealObservabilityData() {
    try {
        const token = localStorage.getItem('token');
        const response = await fetch(`${API_BASE}/powerhouse/observability`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.status === 401) { 
            localStorage.removeItem('token'); 
            window.location.href = 'login.html'; 
            return; 
        } 
        if (response.ok) {
            const data = await response.json();
            
            const alertsContainer = document.getElementById('alerts-container');
            if (alertsContainer && data.alerts && data.alerts.length > 0) {
                alertsContainer.innerHTML = data.alerts.map(alert => `
                    <div class="alert-item ${alert.severity || 'warning'}">
                        <div class="alert-header">
                            <strong><i class="fas ${alert.severity === 'critical' ? 'fa-times-circle' : alert.severity === 'warning' ? 'fa-exclamation-triangle' : 'fa-info-circle'}"></i> ${alert.title}</strong>
                            <span>${new Date(alert.created_at).toLocaleTimeString()}</span>
                        </div>
                        <div>${alert.description}</div>
                    </div>
                `).join('');
            }
            
            if (data.costs && data.costs.length > 0) {
                const costProviders = {
                    'OpenAI (GPT-4)': 'openai-cost',
                    'Anthropic (Claude)': 'anthropic-cost',
                    'Google (Gemini)': 'google-cost'
                };
                
                data.costs.forEach(cost => {
                    const elementId = costProviders[cost.provider];
                    if (elementId) {
                        const element = document.getElementById(elementId);
                        if (element) {
                            element.innerHTML = `
                                <div class="policy-row">
                                    <span>${cost.provider}</span>
                                    <span>$${cost.total}</span>
                                </div>
                                <div class="cost-bar">
                                    <div class="cost-fill" style="width: ${cost.percentage}%;"></div>
                                </div>
                            `;
                        }
                    }
                });
            }
            
            if (data.performance && data.performance.length > 0) {
                const perfMap = {
                    'Inventory Agent': 'inventory-agent-perf',
                    'Lead Scoring Agent': 'leads-agent-perf',
                    'Cart Recovery Agent': 'cart-agent-perf'
                };
                
                data.performance.forEach(agent => {
                    const elementId = perfMap[agent.name];
                    if (elementId) {
                        const element = document.getElementById(elementId);
                        if (element) {
                            element.innerHTML = `
                                <div>${agent.name}</div>
                                <div style="display: flex; justify-content: space-between; font-size: 0.8rem;">
                                    <span>${agent.success_rate}% success</span>
                                    <span>${agent.avg_latency}ms avg</span>
                                </div>
                            `;
                        }
                    }
                });
            }
        }
    } catch (error) {
        console.error('Error fetching observability data:', error);
    }
}

function addAlertToObservability(alert) {
    const alertsContainer = document.getElementById('alerts-container');
    if (alertsContainer) {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert-item ${alert.severity || 'warning'}`;
        alertDiv.innerHTML = `
            <div class="alert-header">
                <strong><i class="fas ${alert.severity === 'critical' ? 'fa-times-circle' : alert.severity === 'warning' ? 'fa-exclamation-triangle' : 'fa-info-circle'}"></i> ${alert.title}</strong>
                <span>Just now</span>
            </div>
            <div>${alert.description}</div>
        `;
        alertsContainer.prepend(alertDiv);
        if (alertsContainer.children.length > 5) {

        }

}

// ===== TOAST NOTIFICATIONS =====
function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.background = type === 'success' ? '#059669' : type === 'info' ? '#2563eb' : '#dc2626';
    toast.style.color = 'white';
    toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'info' ? 'fa-info-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.animation = 'slideIn 0.3s reverse';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// ===== ADD NOTIFICATION =====
function addNotification(title, message) {
    const list = document.getElementById('notificationList');
    const count = document.getElementById('notificationCount');
    
    if (!list) return;
    
    let notificationCount = parseInt(count?.textContent || '0');
    notificationCount++;
    if (count) count.textContent = notificationCount;
    
    const item = document.createElement('div');
    item.className = 'notification-item unread';
    item.innerHTML = `
        <div class="notification-title">
            <span>${title}</span>
            <span class="time">Just now</span>
        </div>
        <div class="notification-message">${message}</div>
    `;
    list.prepend(item);
    
    if (list.children.length > 10) {
        list.lastChild.remove();
    }
}

async function generateContent() {
    const contentType = document.getElementById('contentType')?.value;
    const topic = document.getElementById('contentTopic')?.value;
    const tone = document.getElementById('contentTone')?.value;
    const platformsSelect = document.getElementById('contentPlatforms');
    const platforms = platformsSelect ? Array.from(platformsSelect.selectedOptions).map(o => o.value) : [];
    const instructions = document.getElementById('contentInstructions')?.value;
    
    if (!topic) {
        showToast('Please enter a topic', 'error');
        return;
    }
    
    showToast('🎨 Generating content with AI...', 'info');
    
    try {
        const token = localStorage.getItem('token');
        const response = await fetch(`${API_BASE}/powerhouse/content/create`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                content_type: contentType,
                topic: topic,
                tone: tone,
                platforms: platforms,
                instructions: instructions
            })
        });
        
        if (response.ok) {
            const data = await response.json();
            showToast('✅ Content generated successfully!', 'success');
            alert('Generated content:\n\n' + data.content);
            
            addActiveFeature({
                id: 'content_' + Date.now(),
                name: `Content: ${topic.substring(0, 20)}`
            });
        } else {
            showToast('❌ Failed to generate content', 'error');
        }
    } catch (error) {
        console.error('Content generation error:', error);
        showToast('❌ Failed to generate content', 'error');
    }
}

    showToast('🎨 Generating image with AI...', 'info');

// ===== TOGGLE FEATURE LIVE STATUS =====
function toggleFeatureLive(featureId) {
    const featureCard = document.getElementById(featureId);
    if (!featureCard) return;
    
    if (featureCard.classList.contains('live')) {
        featureCard.classList.remove('live');
        featureCard.classList.add('paused');
        
        const featureName = featureCard.querySelector('h3')?.textContent || 'Feature';
        removeActiveFeature(featureId);
        
        showToast(`⏸️ ${featureName} paused`, 'info');
        addRealTimeActivity('feature', `${featureName} paused`, 'info');
    } else {
        featureCard.classList.remove('paused');
        featureCard.classList.add('live');
        
        const featureName = featureCard.querySelector('h3')?.textContent || 'Feature';
        addActiveFeature({
            id: featureId,
            name: featureName
        });
        
        showToast(`✅ ${featureName} activated`, 'success');
        addRealTimeActivity('feature', `${featureName} activated`, 'success');
        
        if (socket && socket.connected) {
            socket.emit('feature_toggle', { id: featureId, status: 'active' });
        }
    }
}

async function connectAccount() {
    if (!selectedPlatform) {
        showToast('Please select a platform', 'error');
        return;
    }
    
    const accountName = document.getElementById('accountName')?.value;
    const method = document.getElementById('connectionMethod')?.value;
    
    if (!accountName) {
        showToast('Please enter account name', 'error');
        return;
    }
    
    const platform = platforms.find(p => p.id === selectedPlatform);
    
    let connectionData = {
        platform: selectedPlatform,
        accountName: accountName,
        method: method
    };
    
    if (method === 'gateway') {
        const cfAccountId = document.getElementById('cfAccountId')?.value;
        const gatewayName = document.getElementById('gatewayName')?.value;
        const cfToken = document.getElementById('cfToken')?.value;
        
        if (!cfAccountId || !gatewayName || !cfToken) {
            showToast('Please fill all gateway fields', 'error');
            return;
        }
        
        connectionData = {
            ...connectionData,
            gatewayConfig: {
                accountId: cfAccountId,
                gatewayName: gatewayName,
                apiToken: cfToken
            }
        };
        
        const gatewayUrl = `${CLOUDFLARE_GATEWAY_URL}/${cfAccountId}/${gatewayName}`;
        connectionData.gatewayUrl = gatewayUrl;
        
    } else {
        const apiKey = document.getElementById('apiKey')?.value;
        if (!apiKey) {
            showToast('Please enter API key', 'error');
            return;
        }
        connectionData.apiKey = apiKey;
        
        const additionalFields = {};
        const additionalInputs = document.querySelectorAll('#additionalFields input');
        additionalInputs.forEach(input => {
            additionalFields[input.id] = input.value;
        });
        connectionData.additionalFields = additionalFields;
    }
    
    const connectBtn = event.target;
    const originalText = connectBtn.innerHTML;
    connectBtn.innerHTML = '<div class="loading-spinner"></div> Connecting...';
    connectBtn.disabled = true;
    
    try {
        const token = localStorage.getItem('token');
        const response = await fetch(`${API_BASE}/powerhouse/connect`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(connectionData)
        });
        
        if (response.status === 401) { 
            localStorage.removeItem('token'); 
            window.location.href = 'login.html'; 
            return; 
        } 
        if (response.ok) {
            const result = await response.json();
            if (method === 'gateway') {
                showToast('✅ Connected via Cloudflare Gateway! Unified access to 400+ models', 'success');
            } else {
                showToast('✅ Account connected successfully!', 'success');
            }
            closeModal();
            await loadConnectedAccounts();
            await loadActivityLog();
            
            await autoActivateFeaturesForAccount({ platform: selectedPlatform, id: result.account.id });
        } else {
            const error = await response.json();
            showToast(error.error || 'Failed to connect account', 'error');
        }
    } catch (error) {
        showToast('Connection service unavailable', 'error');
    } finally {
        connectBtn.innerHTML = originalText;
        connectBtn.disabled = false;
    }
}
